name: Rewrite Commit History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build orphan branch with correct commit messages
        run: |
          declare -A GAME_TITLES=(
          ["SLUS_210.43"]="Backyard Wrestling 2 - There Goes the Neighborhood [NTSC-U]"
          ["SLES_531.54"]="Bard's Tale [PAL]"
          ["SLUS_208.03"]="Bard's Tale, The [NTSC-U]"
          ["SLPM_624.97"]="The Battleship [NTSC-J]"
          ["SLUS_213.76"]="Black [NTSC-U]"
